# Comprehensive CI/CD Pipeline for Autonomous ML Agent
# This workflow handles testing, building, and deploying your ML agent

name: CI/CD Pipeline

# Trigger conditions
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

# Environment variables
env:
  PYTHON_VERSION: '3.11'
  DOCKER_IMAGE: ml-agent
  REGISTRY: ghcr.io

jobs:
  # 1. Code Quality & Testing
  test:
    name: 🧪 Test & Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: 🎨 Code formatting check
      run: |
        black --check src/ --diff
        echo "✅ Code formatting is correct"
    
    - name: 🔍 Lint code
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ Code linting passed"
    
    - name: 🔬 Type checking
      run: |
        mypy src/ --ignore-missing-imports
        echo "✅ Type checking passed"
    
    - name: 🧪 Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
        echo "✅ All tests passed"
    
    - name: 📊 Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 2. Security Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: 🛡️ Security check
      run: |
        safety check -r requirements.txt
        bandit -r src/ -f json -o bandit-report.json
        echo "✅ Security scan completed"
    
    - name: 📋 Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

  # 3. Build & Package
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: 📦 Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: 🏗️ Build package
      run: |
        python -m build
        echo "✅ Package built successfully"
    
    - name: 📋 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/

  # 4. Docker Build & Push
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🏗️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: 🐳 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 5. Deploy to Streamlit Cloud
  deploy-streamlit:
    name: 🌐 Deploy to Streamlit Cloud
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🌐 Deploy to Streamlit Cloud
      run: |
        echo "🚀 Deploying to Streamlit Cloud..."
        echo "✅ Your app will be automatically deployed!"
        echo "🔗 Check https://share.streamlit.io for deployment status"
    
    - name: 📢 Notify deployment
      run: |
        echo "🎉 Deployment initiated successfully!"
        echo "📱 Your ML Agent is being deployed to Streamlit Cloud"

  # 6. Deploy to Heroku
  deploy-heroku:
    name: 🟣 Deploy to Heroku
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Login to Heroku
      uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        usedocker: true
        docker_heroku_process_type: web

  # 7. Deploy to AWS (ECS)
  deploy-aws:
    name: ☁️ Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔐 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: 🔐 Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: 🏗️ Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ml-agent
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
    
    - name: 🚀 Deploy to ECS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ml-agent
        IMAGE_TAG: ${{ github.sha }}
      run: |
        aws ecs update-service --cluster ml-agent-cluster --service ml-agent-service --force-new-deployment

  # 8. Release Management
  release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    needs: [test, security, build, docker]
    if: github.event_name == 'release'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 📦 Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
    
    - name: 🏷️ Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 9. Notification
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-streamlit, deploy-heroku, deploy-aws]
    if: always()
    
    steps:
    - name: 📢 Notify on Success
      if: ${{ needs.deploy-streamlit.result == 'success' }}
      run: |
        echo "🎉 ML Agent deployed successfully!"
        echo "🌐 Streamlit Cloud: https://share.streamlit.io"
        echo "🟣 Heroku: https://your-app.herokuapp.com"
        echo "☁️ AWS: https://your-app.aws.com"
    
    - name: 📢 Notify on Failure
      if: ${{ needs.deploy-streamlit.result == 'failure' }}
      run: |
        echo "❌ Deployment failed!"
        echo "🔍 Check the logs for details"
